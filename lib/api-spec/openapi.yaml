openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LuxeWash API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: cars
    description: Car management
  - name: packages
    description: Cleaning packages
  - name: orders
    description: Order management
  - name: workers
    description: Worker operations
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /cars:
    get:
      operationId: getCars
      tags: [cars]
      summary: Get user's cars
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      operationId: createCar
      tags: [cars]
      summary: Create a car
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarRequest"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"

  /cars/{id}:
    put:
      operationId: updateCar
      tags: [cars]
      summary: Update a car
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarRequest"
      responses:
        "200":
          description: Car updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
    delete:
      operationId: deleteCar
      tags: [cars]
      summary: Delete a car
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Car deleted

  /packages:
    get:
      operationId: getPackages
      tags: [packages]
      summary: Get all cleaning packages
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"

  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get orders (filtered by role)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: workerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    put:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/assign:
    put:
      operationId: assignWorker
      tags: [orders]
      summary: Assign a worker to an order (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workerId:
                  type: integer
              required:
                - workerId
      responses:
        "200":
          description: Worker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /workers/me:
    get:
      operationId: getWorkerProfile
      tags: [workers]
      summary: Get current worker profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/me/status:
    put:
      operationId: updateWorkerStatus
      tags: [workers]
      summary: Update worker availability status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, busy, offline]
              required:
                - status
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/me/location:
    put:
      operationId: updateWorkerLocation
      tags: [workers]
      summary: Update worker location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
              required:
                - lat
                - lng
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers:
    get:
      operationId: getWorkers
      tags: [workers]
      summary: Get all workers (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/customers:
    get:
      operationId: getAdminCustomers
      tags: [admin]
      summary: Get all customers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
      required:
        - name
        - email
        - password
        - role

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, worker, admin]
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - createdAt

    Car:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        plateNumber:
          type: string
        carType:
          type: string
          enum: [sedan, suv, truck, hatchback]
      required:
        - id
        - userId
        - brand
        - model
        - color
        - plateNumber
        - carType

    CreateCarRequest:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        plateNumber:
          type: string
        carType:
          type: string
          enum: [sedan, suv, truck, hatchback]
      required:
        - brand
        - model
        - color
        - plateNumber
        - carType

    Package:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        items:
          type: array
          items:
            type: string
        tier:
          type: string
          enum: [basic, full, premium]
      required:
        - id
        - name
        - description
        - price
        - items
        - tier

    Order:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        workerId:
          type: integer
          nullable: true
        carId:
          type: integer
        packageId:
          type: integer
        packageName:
          type: string
        addons:
          type: array
          items:
            $ref: "#/components/schemas/Addon"
        status:
          type: string
          enum: [pending, confirmed, en_route, in_progress, finishing, completed, cancelled]
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        locationLat:
          type: number
        locationLng:
          type: number
        locationAddress:
          type: string
        totalPrice:
          type: number
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/User"
          nullable: true
        worker:
          $ref: "#/components/schemas/Worker"
          nullable: true
        car:
          $ref: "#/components/schemas/Car"
          nullable: true
      required:
        - id
        - customerId
        - carId
        - packageId
        - packageName
        - addons
        - status
        - scheduledDate
        - scheduledTime
        - locationLat
        - locationLng
        - locationAddress
        - totalPrice
        - createdAt

    Addon:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        zone:
          type: string
      required:
        - id
        - name
        - price
        - zone

    CreateOrderRequest:
      type: object
      properties:
        carId:
          type: integer
        packageId:
          type: integer
        addons:
          type: array
          items:
            $ref: "#/components/schemas/Addon"
        scheduledDate:
          type: string
        scheduledTime:
          type: string
        locationLat:
          type: number
        locationLng:
          type: number
        locationAddress:
          type: string
        totalPrice:
          type: number
      required:
        - carId
        - packageId
        - addons
        - scheduledDate
        - scheduledTime
        - locationLat
        - locationLng
        - locationAddress
        - totalPrice

    UpdateOrderStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, en_route, in_progress, finishing, completed, cancelled]
      required:
        - status

    Worker:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [available, busy, offline]
        currentOrderId:
          type: integer
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        user:
          $ref: "#/components/schemas/User"
          nullable: true
      required:
        - id
        - userId
        - status

    AdminStats:
      type: object
      properties:
        totalOrdersToday:
          type: integer
        activeWorkers:
          type: integer
        pendingOrders:
          type: integer
        revenueToday:
          type: number
      required:
        - totalOrdersToday
        - activeWorkers
        - pendingOrders
        - revenueToday
